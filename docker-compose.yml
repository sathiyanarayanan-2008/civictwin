version: '3.8'

services:
  # PostgreSQL with PostGIS extension for spatial intelligence
  db:
    image: postgis/postgis:15-3.3
    container_name: civictwin-postgis
    environment:
      POSTGRES_USER: civictwin
      POSTGRES_PASSWORD: civictwin_secure_pwd
      POSTGRES_DB: civictwin_db
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civictwin -d civictwin_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend: FastAPI + Multi-Agent Engine + Geospatial ML
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civictwin-backend
    environment:
      - DATABASE_URL=postgresql://civictwin:civictwin_secure_pwd@db:5432/civictwin_db
      - ENVIRONMENT=production
      - DEBUG=False
      - FRONTEND_URL=http://localhost:3000
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - SECRET_KEY=civictwin-prod-super-secure-key-bf26-2026
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Frontend: React + Vite + Three.js + MapLibre GL
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civictwin-frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
      - VITE_WS_URL=ws://localhost:8000/api/v1/ws
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgis_data:
