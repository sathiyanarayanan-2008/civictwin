services:
  # CivicTwin AI FastAPI Backend Web Service
  - type: web
    name: civictwin-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: civictwin-db
          property: connectionString

# Optional Free-Tier PostgreSQL Database on Render
databases:
  - name: civictwin-db
    plan: free
    databaseName: civictwin_db
    user: civictwin_user
